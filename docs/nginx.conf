upstream gunicorn_hub_i3 {
    # For a TCP configuration (same address/port as docs/hub_i3.service):
    server 127.0.0.1:5000 fail_timeout=0;
}

server {
    listen 80;
    # Replace with the real domain of the site
    server_name hub-i3.example.org;
    client_max_body_size 20M;

    error_log /var/webapp/hub-i3/logs/nginx-error.log;

    location /media/ {
        # MEDIA_ROOT = src/media
        alias /var/webapp/hub-i3/src/media/;
    }

    location /static/ {
        # STATIC_ROOT = <repo root>/static (filled by collectstatic)
        alias /var/webapp/hub-i3/static/;
        expires 30d;
    }

    location / {
        # checks for static file, if not found proxy to app
        try_files $uri @proxy_to_app;

    }

    location @proxy_to_app {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        keepalive_timeout 600;
        proxy_pass   http://gunicorn_hub_i3;
    }
}
