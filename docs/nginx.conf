# Template for the application nginx when a TLS-terminating proxy sits in front
# of it (e.g. Nginx Proxy Manager): browser -> proxy (HTTPS) -> this nginx (HTTP)
# -> gunicorn. If THIS nginx terminates TLS (listen 443 ssl), see the notes marked
# "TLS here" below.

upstream gunicorn_hub_i3 {
    # For a TCP configuration (same address/port as docs/hub_i3.service):
    server 127.0.0.1:5000 fail_timeout=0;
}

server {
    listen 80;
    # Replace with the real domain of the site
    server_name hub-i3.example.org;
    client_max_body_size 20M;

    error_log /var/webapp/hub-i3/logs/nginx-error.log;

    # Real client IP. The proxy in front APPENDS to X-Forwarded-For instead of
    # replacing it, so the first value can be forged by the client. Trust only the
    # proxy's address (replace with its IP) and let nginx compute the real client
    # IP in $remote_addr (needs ngx_http_realip_module: nginx -V | grep realip).
    set_real_ip_from 10.0.0.10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Only the proxy may reach this server. Without this, anyone who can reach
    # this port directly can forge X-Forwarded-For / X-Forwarded-Proto.
    allow 10.0.0.10;
    deny all;

    location /media/ {
        # MEDIA_ROOT = src/media
        alias /var/webapp/hub-i3/src/media/;
    }

    location /static/ {
        # STATIC_ROOT = <repo root>/static (filled by collectstatic)
        alias /var/webapp/hub-i3/static/;
        expires 30d;
    }

    location / {
        # checks for static file, if not found proxy to app
        try_files $uri @proxy_to_app;

    }

    location @proxy_to_app {
        proxy_set_header Host $http_host;
        # A single, trusted IP: the BruteForceProtectionMiddleware uses the first
        # value of X-Forwarded-For, so it must not contain client-supplied values.
        proxy_set_header X-Forwarded-For $remote_addr;
        # X-Forwarded-Proto: do NOT set it here when a proxy terminates TLS. This
        # nginx sees plain HTTP, so "$scheme" would be "http" and Django would
        # redirect to https forever (SECURE_SSL_REDIRECT). Without a
        # proxy_set_header, nginx forwards the header sent by the proxy in front,
        # which is what settings/production.py (SECURE_PROXY_SSL_HEADER) expects.
        # TLS here: add "proxy_set_header X-Forwarded-Proto $scheme;" instead.
        proxy_redirect off;
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        keepalive_timeout 600;
        proxy_pass   http://gunicorn_hub_i3;
    }
}
