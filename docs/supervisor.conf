; Alternative to docs/hub_i3.service (systemd). Use only one of the two.
; gunicorn lives in the uv virtualenv (.venv); it exists after:
;   uv sync --frozen --no-dev --group prod
[program:hub-i3]
command=/var/webapp/hub-i3/.venv/bin/gunicorn eucs_platform.wsgi:application -b 127.0.0.1:5000 -w 4 --chdir /var/webapp/hub-i3/src --access-logfile - --error-logfile /var/webapp/hub-i3/logs/gunicorn-error.log
directory=/var/webapp/hub-i3/src
user=webapp
autostart=true
autorestart=unexpected
startsecs=1
startretries=3
redirect_stderr=true
