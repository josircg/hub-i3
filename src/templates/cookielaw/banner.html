{% load i18n %}
<div id="CookielawBanner" role="region" aria-label="{% trans 'Cookie notice' %}">
    <div class="container d-flex flex-wrap align-items-center justify-content-between gap-2">
        <span>{% trans 'This website uses cookies.' %} <a href="{% url 'privacy' %}" target="_blank" rel="noopener noreferrer">{% trans 'More info' %}</a>.</span>
        <button type="button" class="btn btn-my-outline-darkBlue" onclick="Cookielaw.accept();">{% trans "That's fine" %}</button>
    </div>
</div>
<style>
#CookielawBanner { position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999; background: #fff; color: #222; box-shadow: 0 -2px 12px rgba(0,0,0,.15); padding: 12px 0; }
#CookielawBanner .container { gap: 12px; }
</style>
