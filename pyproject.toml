[project]
name = "hub-i3"
version = "0.2.0"
description = "Hub I3 — plataforma de ciência cidadã, fork do EU-Citizen.Science"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django[argon2]>=5.2,<5.3",
    "django-authtools>=2.1.0",
    "django-braces>=1.17.0",
    "django-crispy-forms>=2.7",
    "crispy-bootstrap3>=2024.1",
    "django-environ>=0.14.0",
    "pillow>=13.0.0",
    "easy-thumbnails>=2.10.1",
    "django-select2>=8.6.1",
    "psycopg>=3.3.9",
    "django-leaflet>=0.34.0",
    "geopy>=2.5.0",
    "django-countries>=9.1.0",
    "django-cookie-law>=2.2.0",
    "djangorestframework>=3.18.3",
    "djoser>=2.3.5",
    "drf-spectacular>=0.30.0",
    "drf-spectacular-sidecar>=2026.10.1",
    "django-oidc-provider>=0.9.0",
    "django-active-link>=0.3.0",
    "django-cron>=0.7.1",
    "django-ckeditor<6.7",
    "django-oauth-toolkit>=3.4.1",
    "python-dateutil>=4.0.0",
    "django-simple-captcha>=0.8.0",
    "djangorestframework-csv>=3.0.2",
    "django-cleanup>=9.0.0",
    "django-admin-tools>=0.9.4",
    "cairosvg>=2.9.1",
    "unidecode>=1.4.0",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "django-honeypot>=1.3.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "fabric>=3.2.3",
    "pre-commit>=4.7.0",
    "ruff>=0.17.5",
    "werkzeug>=3.1.9",
]
prod = [
    "gunicorn",
]

[tool.uv]
package = false

[tool.uv.sources]
django-cron = { git = "https://github.com/jorenham/django-cron" }

[tool.ruff]
line-length = 120
exclude = [
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*",
    "development.py",
    "production.py",
    "wsgi.py",
    "__pycache__",
]

[tool.ruff.lint]
# Selects the linting rule sets to be applied:
# E/W: Pycodestyle Errors and Warnings (equivalent to Flake8)
# F: Pyflakes Errors (logical errors)
# I: Import sorting rules (equivalent to isort)
# PL: Pylint rules (convention rules and potential bugs)
select = ["E", "W", "F", "I", "PL"]
# Rules to be ignored:
# PLR0917: Function with too many positional arguments (complements PLR0913).
ignore = [
    "PLR2004",
    "PLC0415",
    "PLR0913",
    "PLR0917",
]

[tool.ruff.lint.pylint]
# Limits calibrated by the largest existing case in the project, so preexisting structural debt
# does not block commits while any function worse than it is still reported.
max-branches = 27     # projects/api/serializers.py:163
max-statements = 73   # projects/api/serializers.py:163 and projects/management/commands/populate_visao.py:244
max-returns = 7       # accounts/views.py:80

[tool.ruff.format]
quote-style = "single"
