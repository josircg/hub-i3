[project]
name = "hub-i3"
version = "0.1.0"
description = "Hub I3 — plataforma de ciência cidadã, fork do EU-Citizen.Science"
requires-python = ">=3.10,<3.11"
dependencies = [
    "django<4.0",
    "django-authtools>=2.0.2",
    "django-braces==1.15.0",
    "django-crispy-forms==2.0",
    "crispy-bootstrap3==2022.1",
    "django-environ==0.11.2",
    "pillow==10.1.0",
    "easy-thumbnails==2.8.5",
    "django_select2==8.1.2",
    "psycopg2-binary==2.9.9",
    "django-leaflet==0.28.3",
    "geopy==2.4.0",
    "django-countries==7.5.1",
    "django_summernote==0.8.20.0",
    "django-cookie-law==2.2.0",
    "djangorestframework==3.14.0",
    "djoser==2.2.0",
    "django-rest-swagger==2.2.0",
    "django-oidc-provider==0.8.0",
    "drf-yasg==1.21.7",
    "django-active-link==0.1.8",
    "django-cron==0.5.1",
    "django-ckeditor<6.7",
    "django-oauth-toolkit==2.3.0",
    "argon2_cffi==23.1.0",
    "python-dateutil==2.8.2",
    "django-ranged-response==0.2.0",
    "django-simple-captcha==0.5.18",
    "djangorestframework-csv==2.1.1",
    "django-cleanup==8.0.0",
    "django-admin-tools==0.9.3",
    "cairosvg==2.7.1",
    "Unidecode==1.3.7",
    "requests",
    "beautifulsoup4~=4.12.3",
    "django-honeypot==1.2.1",
    "setuptools<81",
]

[dependency-groups]
dev = [
    "django-debug-toolbar==4.2.0",
    "sqlparse==0.4.4",
    "werkzeug<3",
    "fabric==3.2.2",
    "pre-commit>=3.5.0",
    "ruff>=0.15.7",
    "pytz~=2023.3.post1",
    "six~=1.16.0",
    "invoke~=2.2.0",
    "Werkzeug<3",
]
prod = [
    "django[argon2]",
    "gunicorn",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
exclude = [
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*",
    "development.py",
    "production.py",
    "__pycache__",
]

[tool.ruff.lint]
# Selects the linting rule sets to be applied:
# E/W: Pycodestyle Errors and Warnings (equivalent to Flake8)
# F: Pyflakes Errors (logical errors)
# I: Import sorting rules (equivalent to isort)
# PL: Pylint rules (convention rules and potential bugs)
select = ["E", "W", "F", "I", "PL"]
# Rules to be ignored:
# PLR0917: Function with too many positional arguments (complements PLR0913).
ignore = [
    "PLR2004",
    "PLC0415",
    "PLR0913",
    "PLR0917",
]

[tool.ruff.lint.pylint]
# Limits calibrated by the largest existing case in the project, so preexisting structural debt
# does not block commits while any function worse than it is still reported.
max-branches = 27     # projects/api/serializers.py:163
max-statements = 73   # projects/api/serializers.py:163 and projects/management/commands/populate_visao.py:244
max-returns = 7       # accounts/views.py:80

[tool.ruff.format]
quote-style = "single"
